



{% extends 'base.html' %}

{% block content %}
    <div class="wrapper">
        <div class="container-fluid" style="margin-top: 1.7em;">
            <div class="row">
                <div class="mx-0 mx-sm-auto">
                    <div class="card">
                        <div class="card-header bg-primary">
                            <h5 class="card-title text-white mt-2" id="exampleModalLabel">{{ poll.title }}</h5>
                        </div>
                        <div class="modal-body">
                            <div class="text-center">
                                <i class="far fa-file-alt fa-4x mb-3 text-primary"></i>
                                <p>
                                    <strong>Your opinion matters</strong>
                                </p>
                                <p>
                                    {{ poll.title }}
                                </p>
                            </div>

                            <hr />

                            <form class="px-4" id="feedbackForm" method="post">
                                {% csrf_token %}
                                <p class="text-center"><strong>Your rating:</strong></p>

                                
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="exampleForm" value="Very good" id="radio3Example1" />
                                    <label class="form-check-label" for="radio3Example1">
                                        Very good
                                    </label>
                                </div>
                                <div class="form-check mb-2">
                                  <input class="form-check-input" type="radio" name="exampleForm" value="good" id="radio3Example2" />
                                  <label class="form-check-label" for="radio3Example2">
                                      good
                                  </label>
                                </div>
                                <div class="form-check mb-2">
                                  <input class="form-check-input" type="radio" name="exampleForm" value="normal" id="radio3Example3" />
                                  <label class="form-check-label" for="radio3Example3">
                                      Normal
                                  </label>
                                </div>
                                <div class="form-check mb-2">
                                  <input class="form-check-input" type="radio" name="exampleForm" value="poor" id="radio3Example4" />
                                  <label class="form-check-label" for="radio3Example4">
                                      Poor
                                  </label>
                                </div>
                              
                                <div class="form-outline mb-4">
                                    <textarea class="form-control" name="feedback" id="form4Example3" rows="4"></textarea>
                                    <label class="form-label" for="form4Example3">Your feedback</label>
                                </div>
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
      $(document).ready(function() {
          $('form').parsley();
      });
  </script>

{% endblock %}
